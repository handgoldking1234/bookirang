<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B2C">
<title>북이랑 - 책 찍고 AI랑 도란도란</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
<style>
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#EEF1EE !important}
#app>div{box-shadow:0 20px 60px rgba(0,0,0,.12);border-radius:32px}
@media (max-width:1024px), (pointer:coarse){
body{display:block;background:#FFFFFF !important}
#app>div{width:100% !important;height:100vh !important;height:100dvh !important;border-radius:0;box-shadow:none}
#app>div>.scroll,#app>div>div{padding-left:max(20px, calc((100% - 720px) / 2)) !important;padding-right:max(20px, calc((100% - 720px) / 2)) !important}
#app>div>nav{padding-left:max(0px, calc((100% - 720px) / 2));padding-right:max(0px, calc((100% - 720px) / 2))}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; background: #FFFFFF; color: #16201A; font-family: 'Noto Sans KR', 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<!-- ===== HOME ===== -->
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 8px">
<svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#0E6B2C"/><path d="M9 11h6a3 3 0 0 1 3 3v12a2.2 2.2 0 0 0-2.2-2.2H9z" fill="#FFFFFF"/><path d="M27 11h-6a3 3 0 0 0-3 3v12a2.2 2.2 0 0 1 2.2-2.2H27z" fill="#FFFFFF"/><circle cx="29" cy="7" r="4.5" fill="#F27A1A"/></svg>
<span style="font-size: 24px; font-weight: 900; letter-spacing: -1px; color: #0E6B2C">북이랑</span>
</span>
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #FFF0E3; font-size: 13px; font-weight: 700; color: #B4530B">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>5일 연속
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; color: #5C6B60">안녕, 서윤아!</span>
<b style="font-size: 26px; line-height: 1.3; letter-spacing: -0.5px">오늘은 어떤 이야기를<br>읽었어?</b>
</div>
<button onClick="{{ goScan }}" style="border: 0; background: #0E6B2C; color: #FFFFFF; border-radius: 24px; padding: 24px 22px; display: flex; align-items: center; gap: 18px; text-align: left">
<span style="width: 60px; height: 60px; flex: none; border-radius: 18px; background: #FFFFFF; color: #0E6B2C; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<b style="font-size: 21px">찰칵! 책 찍기</b>
<span style="font-size: 14px; color: #D3E9D9">한 쪽만 찍어도 이야기가 시작돼요</span>
</span>
</button>

<button onClick="{{ goPlan }}" style="border: 1px solid #CFDDF8; background: #F4F8FF; color: #16201A; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px; text-align: left">
<span style="width: 56px; height: 72px; flex: none; border-radius: 8px; background: #1F6FEB; color: #FFF; display: flex; align-items: flex-end; padding: 6px; font-size: 11px; font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif">Day 5</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 12px; font-weight: 700; color: #1A56C4">오늘의 추천 책 · 2주 플랜 5/14</span>
<b style="font-size: 16px; font-family: 'Plus Jakarta Sans', sans-serif">Mercy Watson to the Rescue</b>
<span style="font-size: 12px; color: #5C6B60">Lv.3 · 약 15분 분량</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6B60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</button>

<button onClick="{{ goReview }}" style="border: 1px solid #F6D3B5; background: #FFF8F2; color: #16201A; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px; text-align: left">
<span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: #F27A1A; color: #2B1600; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<b style="font-size: 16px">어제 고친 표현 다시 말하기</b>
<span style="font-size: 13px; color: #5C6B60">3문장 · 1분이면 끝나요</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6B60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</button>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 18px">이번 주</b><button onClick="{{ goStats }}" style="border: 0; background: none; color: #0E6B2C; font-size: 13px; font-weight: 700; padding: 8px 0">성장 보기</button></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">북토킹</span><b style="font-size: 24px; color: #0E6B2C">4회</b></div>
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">말한 문장</span><b style="font-size: 24px; color: #0E6B2C">86</b></div>
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">새 단어</span><b style="font-size: 24px; color: #0E6B2C">23</b></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 18px">최근 읽은 책</b><button onClick="{{ goShelf }}" style="border: 0; background: none; color: #0E6B2C; font-size: 13px; font-weight: 700; padding: 8px 0">책장</button></div>
<div class="scroll" style="display: flex; gap: 12px; overflow-x: auto">
<sc-for list="{{ recent }}" as="b" hint-placeholder-count="3">
<button onClick="{{ goReport }}" style="border: 0; flex: none; width: 132px; background: #F4F6F4; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; color: #16201A">
<span style="{{ b.cover }}">{{ b.short }}</span>
<b style="font-size: 13px; line-height: 1.35">{{ b.title }}</b>
<span style="font-size: 11px; color: #5C6B60">{{ b.date }}</span>
</button>
</sc-for>
</div>
</div>
</div>
</sc-if>

<!-- ===== PLAN: 2주 14권 추천 ===== -->
<sc-if value="{{ isPlan }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<b style="font-size: 24px; letter-spacing: -0.5px">서윤이 맞춤 2주 플랜</b>
<span style="font-size: 13px; color: #5C6B60; line-height: 1.6">최근 북토킹 4번의 문장 길이, 어휘, 이해도를 보고 하루 한 권씩 골랐어요.</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="padding: 6px 12px; border-radius: 999px; background: #0E6B2C; color: #FFF; font-size: 13px; font-weight: 700">Lv.3 중급 리더</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #E8F0FE; color: #1A56C4; font-size: 13px; font-weight: 700">AR 2~3 수준</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #FFF0E3; color: #B4530B; font-size: 13px; font-weight: 700">4/14권 완료</span>
</div>
<div style="border: 1px solid #E3E8E4; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><b>1주차</b><span style="color: #5C6B60">11월 4일 – 10일</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ week1 }}" as="d" hint-placeholder-count="7"><span style="{{ d.style }}">{{ d.n }}</span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; padding-top: 4px"><b>2주차</b><span style="color: #5C6B60">11월 11일 – 17일</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ week2 }}" as="d" hint-placeholder-count="7"><span style="{{ d.style }}">{{ d.n }}</span></sc-for>
</div>
<div style="display: flex; gap: 14px; font-size: 11px; color: #5C6B60; padding-top: 2px">
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0E6B2C"></span>완료</span>
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #1F6FEB"></span>오늘</span>
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #EEF1EE"></span>예정</span>
</div>
</div>
<div style="background: #F4F8FF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 700; color: #1A56C4">DAY 5 · 오늘의 책</span>
<div style="display: flex; gap: 14px">
<span style="width: 72px; height: 96px; flex: none; border-radius: 8px; background: #1F6FEB; color: #FFF; display: flex; align-items: flex-end; padding: 8px; font-weight: 800; font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif">Mercy</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<b style="font-size: 17px; font-family: 'Plus Jakarta Sans', sans-serif">Mercy Watson to the Rescue</b>
<span style="font-size: 12px; color: #5C6B60">챕터북 · 동물 · 유머</span>
<span style="font-size: 12px; color: #5C6B60">추천 이유: 지난주 동물 이야기에서 대화가 가장 길었어요</span>
</div>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; color: #1A56C4; font-size: 12px; font-weight: 700">미리 볼 단어</span>
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; font-size: 12px">rescue</span>
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; font-size: 12px">porcine</span>
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; font-size: 12px">toast</span>
</div>
<button onClick="{{ goScan }}" style="border: 0; min-height: 52px; border-radius: 999px; background: #0E6B2C; color: #FFF; font-size: 16px; font-weight: 800">다 읽었으면 찰칵!</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<b style="font-size: 15px; padding-bottom: 6px">2주 도서 목록</b>
<sc-for list="{{ plan }}" as="p" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #EEF1EE">
<span style="{{ p.badge }}">{{ p.day }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif">{{ p.title }}</b><span style="font-size: 12px; color: #5C6B60">{{ p.genre }}</span></span>
<span style="{{ p.stateStyle }}">{{ p.state }}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #5C6B60; text-align: center">난이도가 맞지 않나요? 다음 추천에 반영해요</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="border: 1px solid #E3E8E4; background: #FFF; min-height: 48px; border-radius: 999px; font-size: 14px; font-weight: 700; color: #16201A">너무 쉬워요</button>
<button style="border: 1px solid #E3E8E4; background: #FFF; min-height: 48px; border-radius: 999px; font-size: 14px; font-weight: 700; color: #16201A">너무 어려워요</button>
</div>
</div>
</div>
</sc-if>

<!-- ===== SCAN ===== -->
<sc-if value="{{ isScan }}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; background: #0E1410; color: #FFFFFF; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 12px">
<button aria-label="닫기" onClick="{{ goHome }}" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #2A332D; color: #FFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
<span style="font-size: 15px; font-weight: 700">책 찍기 · 1/3쪽</span>
<span style="width: 44px"></span>
</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px">
<div style="width: 290px; height: 420px; position: relative; border-radius: 12px; background: #EDE8DA; transform: rotate(-2deg); padding: 36px 28px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 14px; width: 70%; background: #3A3A3A; border-radius: 4px"></div>
<div style="height: 8px; width: 100%; background: #9C9486; border-radius: 4px"></div>
<div style="height: 8px; width: 94%; background: #9C9486; border-radius: 4px"></div>
<div style="height: 8px; width: 98%; background: #9C9486; border-radius: 4px"></div>
<div style="height: 8px; width: 80%; background: #9C9486; border-radius: 4px"></div>
<div style="height: 90px; width: 100%; background: #C9D7E8; border-radius: 8px"></div>
<div style="height: 8px; width: 96%; background: #9C9486; border-radius: 4px"></div>
<div style="height: 8px; width: 90%; background: #9C9486; border-radius: 4px"></div>
<div style="height: 8px; width: 60%; background: #9C9486; border-radius: 4px"></div>
<div style="position: absolute; inset: -10px; border: 3px solid #F27A1A; border-radius: 16px"></div>
</div>
</div>
<span style="text-align: center; font-size: 14px; color: #C8D2CB; padding-bottom: 16px">글자가 잘 보이게 틀 안에 맞춰 주세요</span>
<div style="display: flex; justify-content: space-around; align-items: center; padding: 8px 32px 40px">
<button aria-label="갤러리에서 고르기" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: #2A332D; color: #FFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button>
<button aria-label="촬영" onClick="{{ goConfirm }}" style="width: 80px; height: 80px; border-radius: 50%; border: 5px solid #FFF; background: #0E6B2C"></button>
<span style="width: 48px"></span>
</div>
</div>
</sc-if>

<!-- ===== CONFIRM ===== -->
<sc-if value="{{ isConfirm }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="뒤로" onClick="{{ goScan }}" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #F4F6F4; color: #16201A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
<b style="font-size: 17px">이 글로 이야기할까요?</b>
</div>
<div style="background: #F4F6F4; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<b style="font-size: 20px; font-family: 'Plus Jakarta Sans', sans-serif">The Singing Whales</b>
<span style="padding: 5px 10px; border-radius: 999px; background: #E7F3EA; color: #0B5E25; font-size: 12px; font-weight: 700; flex: none">딱 맞는 난이도</span>
</div>
<span style="font-size: 14px; color: #5C6B60; line-height: 1.6">주제: 혹등고래가 노래하는 이유와 따뜻한 바다로의 이동</span>
<div style="font-size: 14px; line-height: 1.7; color: #2E3A31; font-family: 'Plus Jakarta Sans', sans-serif; background: #FFFFFF; border-radius: 12px; padding: 14px">Humpback whales are famous for their songs. A song can last for many minutes, and whales may repeat it for hours…</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 15px">먼저 듣고 따라 말해요</b><span style="font-size: 12px; color: #5C6B60">핵심 단어 5개</span></div>
<sc-for list="{{ words }}" as="w" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid #E3E8E4; border-radius: 14px">
<button aria-label="발음 듣기" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: #E8F0FE; color: #1A56C4; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg></button>
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 15px; font-family: 'Plus Jakarta Sans', sans-serif">{{ w.en }}</b><span style="font-size: 12px; color: #5C6B60">{{ w.ko }}</span></span>
<span style="font-size: 12px; font-weight: 700; color: #0E6B2C">따라 말하기</span>
</div>
</sc-for>
</div>
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px 16px; font-size: 13px; line-height: 1.6; color: #2E3A31">질문 6개 준비 · 약 12분<br><span style="color: #5C6B60">마음 열기 1 → 내용 확인 2 → 생각 말하기 3</span></div>

/* 북이랑 프로토타입 미니 런타임: {{값}}, sc-if, sc-for, on이벤트만 처리 */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(next) { Object.assign(this.state, next); render(); }
}
var __comp = null;
var HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
var WHOLE = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
function look(scope, path) {
  if (path === 'true') return true;
  if (path === 'false') return false;
  return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
}
function fill(str, scope) {
  return str.replace(HOLE, function (_, p) { var v = look(scope, p); return v == null ? '' : v; });
}
function walk(node, scope) {
  if (node.nodeType === 3) { if (node.nodeValue.indexOf('{{') > -1) node.nodeValue = fill(node.nodeValue, scope); return; }
  if (node.nodeType !== 1) return;
  var tag = node.tagName.toLowerCase();
  if (tag === 'sc-if') {
    var m = (node.getAttribute('value') || '').match(WHOLE);
    var ok = m ? look(scope, m[1]) : false;
    var frag = document.createDocumentFragment();
    if (ok) { while (node.firstChild) frag.appendChild(node.firstChild); kids(frag, scope); }
    node.replaceWith(frag);
    return;
  }
  if (tag === 'sc-for') {
    var lm = (node.getAttribute('list') || '').match(WHOLE);
    var list = (lm && look(scope, lm[1])) || [];
    var as = node.getAttribute('as') || 'item';
    var out = document.createDocumentFragment();
    list.forEach(function (item, i) {
      var s = Object.create(scope); s[as] = item; s.$index = i;
      var f = document.createDocumentFragment();
      Array.prototype.forEach.call(node.childNodes, function (c) { f.appendChild(c.cloneNode(true)); });
      kids(f, s);
      out.appendChild(f);
    });
    node.replaceWith(out);
    return;
  }
  Array.prototype.slice.call(node.attributes).forEach(function (a) {
    if (a.name.indexOf('hint-') === 0) { node.removeAttribute(a.name); return; }
    var w = a.value.match(WHOLE);
    if (a.name.indexOf('on') === 0 && w) {
      var fn = look(scope, w[1]);
      node.removeAttribute(a.name);
      if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
      return;
    }
    if (a.value.indexOf('{{') > -1) node.setAttribute(a.name, fill(a.value, scope));
  });

}
function kids(parent, scope) {
  Array.prototype.slice.call(parent.childNodes).forEach(function (c) { walk(c, scope); });
}
function render() {
  var app = document.getElementById('app');
  var keep = {};
  app.querySelectorAll('.scroll').forEach(function (el, i) { keep[i] = el.scrollTop; });
  var vals = __comp.renderVals();
  var frag = document.getElementById('tpl').content.cloneNode(true);
  kids(frag, vals);
  app.replaceChildren(frag);
  app.querySelectorAll('.scroll').forEach(function (el, i) { if (keep[i]) el.scrollTop = keep[i]; });
}
function mount(C) { __comp = new C({}); render(); }

</script>
