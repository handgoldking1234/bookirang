<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B2C">
<title>북이랑 - 책 찍고 AI랑 도란도란</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.topbar{position:sticky;top:0;z-index:4;background:#FFFFFF;margin:0 -20px;padding-left:20px;padding-right:20px;padding-bottom:8px;box-shadow:0 1px 0 rgba(0,0,0,0)}
.topbar.stuck{box-shadow:0 1px 0 #E3E8E4}
@keyframes doranTalk{0%,100%{transform:scaleY(.35)}25%{transform:scaleY(1)}50%{transform:scaleY(.55)}75%{transform:scaleY(.9)}}
@keyframes doranBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.doran-mouth{transform-origin:100px 124px;transform:scaleY(.35);transition:transform .15s}
.doran.talking .doran-mouth{animation:doranTalk .32s ease-in-out infinite}
.doran.talking svg{animation:doranBob .64s ease-in-out infinite}
@keyframes doranRing{0%{box-shadow:0 0 0 0 rgba(14,107,44,.45)}100%{box-shadow:0 0 0 12px rgba(14,107,44,0)}}
.doran img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.doran.talking{animation:doranRing 1s ease-out infinite}
.doran.talking img{animation:doranBob .7s ease-in-out infinite}
.doran.body img{border-radius:20px}
@keyframes doranRingSq{0%{box-shadow:0 0 0 0 rgba(14,107,44,.4)}100%{box-shadow:0 0 0 12px rgba(14,107,44,0)}}
</style>
<style>
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#EEF1EE !important}
#app>div{box-shadow:0 20px 60px rgba(0,0,0,.12);border-radius:32px}
@media (max-width:1024px), (pointer:coarse){
body{display:block;background:#FFFFFF !important}
#app>div{width:100% !important;height:100vh !important;height:100dvh !important;border-radius:0;box-shadow:none}
#app>div>.scroll,#app>div>div{padding-left:max(20px, calc((100% - 720px) / 2)) !important;padding-right:max(20px, calc((100% - 720px) / 2)) !important}
#app>div>nav{padding-left:max(0px, calc((100% - 720px) / 2));padding-right:max(0px, calc((100% - 720px) / 2))}
}
</style>
</head>
<body>
<div id="app"></div>
<!-- 북토킹 모듈 core: 호스트 앱에 넣을 때는 window.BookTalkHost 를 먼저 정의한 뒤 이 7개를 로드 -->
<script src="booktalk/core/host.js"></script>
<script src="booktalk/core/api.js"></script>
<script src="booktalk/core/store.js"></script>
<script src="booktalk/core/stats.js"></script>
<script src="booktalk/core/voice.js"></script>
<script src="booktalk/core/listen.js"></script>
<script src="booktalk/core/topics.js"></script>
<template id="tpl">
<div style="width: 390px; height: 844px; background: #FFFFFF; color: #16201A; font-family: 'Noto Sans KR', 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<!-- ===== HOME ===== -->
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 20px">
<div class="topbar" style="padding-top: 24px; display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 8px">
<svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#0E6B2C"/><path d="M9 11h6a3 3 0 0 1 3 3v12a2.2 2.2 0 0 0-2.2-2.2H9z" fill="#FFFFFF"/><path d="M27 11h-6a3 3 0 0 0-3 3v12a2.2 2.2 0 0 1 2.2-2.2H27z" fill="#FFFFFF"/><circle cx="29" cy="7" r="4.5" fill="#F27A1A"/></svg>
<span style="font-size: 24px; font-weight: 900; letter-spacing: -1px; color: #0E6B2C">{{ appName }}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #FFF0E3; font-size: 13px; font-weight: 700; color: #B4530B">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>5일 연속
</div>
<button aria-label="내 정보" onClick="{{ goMe }}" style="width: 40px; height: 40px; border: 0; border-radius: 50%; background: #0E6B2C; color: #FFFFFF; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{ childInit }}</button>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; color: #5C6B60">안녕, {{ childName }}!</span>
<b style="font-size: 26px; line-height: 1.3; letter-spacing: -0.5px">오늘은 어떤 이야기를<br>읽었어?</b>
</div>
<button onClick="{{ goBookTalk }}" style="border: 0; background: #0E6B2C; color: #FFFFFF; border-radius: 24px; padding: 24px 22px; display: flex; align-items: center; gap: 18px; text-align: left">
<span style="width: 60px; height: 60px; flex: none; border-radius: 18px; background: #FFFFFF; color: #0E6B2C; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<b style="font-size: 21px">북토킹 시작</b>
<span style="font-size: 14px; color: #D3E9D9">책 사진을 올리고 {{ tutorName }}랑 바로 이야기해요</span>
</span>
</button>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{ goTopic }}" style="border: 0; background: #E8650A; color: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 132px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>오늘의 주제</span>
<b style="font-size: 17px; line-height: 1.3; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF">{{ todayEn }}</b>
<span style="font-size: 12px; color: #FFFFFF">{{ todayKo }} · 프리토킹</span>
</button>
<button onClick="{{ goPick }}" style="border: 1px solid #CFDDF8; background: #F4F8FF; color: #16201A; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 132px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #1A56C4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>교과서 · 원서</span>
<b style="font-size: 17px; line-height: 1.3">단원이나 책을<br>골라서 이야기</b>
<span style="font-size: 12px; color: #5C6B60">{{ childGrade }} 교과서 표현</span>
</button>
</div>

<button onClick="{{ goPlan }}" style="border: 1px solid #CFDDF8; background: #F4F8FF; color: #16201A; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px; text-align: left">
<span style="width: 56px; height: 72px; flex: none; border-radius: 8px; background: #1F6FEB; color: #FFF; display: flex; align-items: flex-end; padding: 6px; font-size: 11px; font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif">Day 5</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 12px; font-weight: 700; color: #1A56C4">오늘의 추천 책 · 2주 플랜 5/14</span>
<b style="font-size: 16px; font-family: 'Plus Jakarta Sans', sans-serif">Mercy Watson to the Rescue</b>
<span style="font-size: 12px; color: #5C6B60">Lv.3 · 약 15분 분량</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6B60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</button>

<button onClick="{{ goReview }}" style="border: 1px solid #F6D3B5; background: #FFF8F2; color: #16201A; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px; text-align: left">
<span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: #E8650A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<b style="font-size: 16px">어제 고친 표현 다시 말하기</b>
<span style="font-size: 13px; color: #5C6B60">3문장 · 1분이면 끝나요</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6B60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</button>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 18px">이번 주</b><button onClick="{{ goStats }}" style="border: 0; background: none; color: #0E6B2C; font-size: 13px; font-weight: 700; padding: 8px 0">성장 보기</button></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">북토킹</span><b style="font-size: 24px; color: #0E6B2C">4회</b></div>
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">말한 문장</span><b style="font-size: 24px; color: #0E6B2C">86</b></div>
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">새 단어</span><b style="font-size: 24px; color: #0E6B2C">23</b></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 18px">최근 읽은 책</b><button onClick="{{ goShelf }}" style="border: 0; background: none; color: #0E6B2C; font-size: 13px; font-weight: 700; padding: 8px 0">책장</button></div>
<div class="scroll" style="display: flex; gap: 12px; overflow-x: auto">
<sc-for list="{{ recent }}" as="b" hint-placeholder-count="3">
<button onClick="{{ goReport }}" style="border: 0; flex: none; width: 132px; background: #F4F6F4; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; color: #16201A">
<span style="{{ b.cover }}">{{ b.short }}</span>
<b style="font-size: 13px; line-height: 1.35">{{ b.title }}</b>
<span style="font-size: 11px; color: #5C6B60">{{ b.date }}</span>
</button>
</sc-for>
</div>
</div>
</div>
</sc-if>

<!-- ===== PLAN: 2주 14권 추천 ===== -->
<sc-if value="{{ isPlan }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div class="topbar" style="padding-top: 20px; display: flex; flex-direction: column; gap: 6px">
<b style="font-size: 24px; letter-spacing: -0.5px">{{ childName }} 맞춤 2주 플랜</b>
<span style="font-size: 13px; color: #5C6B60; line-height: 1.6">최근 북토킹 4번의 문장 길이, 어휘, 이해도를 보고 하루 한 권씩 골랐어요.</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="padding: 6px 12px; border-radius: 999px; background: #0E6B2C; color: #FFF; font-size: 13px; font-weight: 700">Lv.3 중급 리더</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #E8F0FE; color: #1A56C4; font-size: 13px; font-weight: 700">AR 2~3 수준</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #FFF0E3; color: #B4530B; font-size: 13px; font-weight: 700">4/14권 완료</span>
</div>
<div style="border: 1px solid #E3E8E4; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><b>1주차</b><span style="color: #5C6B60">11월 4일 – 10일</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ week1 }}" as="d" hint-placeholder-count="7"><span style="{{ d.style }}">{{ d.n }}</span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; padding-top: 4px"><b>2주차</b><span style="color: #5C6B60">11월 11일 – 17일</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ week2 }}" as="d" hint-placeholder-count="7"><span style="{{ d.style }}">{{ d.n }}</span></sc-for>
</div>
<div style="display: flex; gap: 14px; font-size: 11px; color: #5C6B60; padding-top: 2px">
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0E6B2C"></span>완료</span>
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #1F6FEB"></span>오늘</span>
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #EEF1EE"></span>예정</span>
</div>
</div>
<div style="background: #F4F8FF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 700; color: #1A56C4">DAY 5 · 오늘의 책</span>
<div style="display: flex; gap: 14px">
<span style="width: 72px; height: 96px; flex: none; border-radius: 8px; background: #1F6FEB; color: #FFF; display: flex; align-items: flex-end; padding: 8px; font-weight: 800; font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif">Mercy</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<b style="font-size: 17px; font-family: 'Plus Jakarta Sans', sans-serif">Mercy Watson to the Rescue</b>
<span style="font-size: 12px; color: #5C6B60">챕터북 · 동물 · 유머</span>
<span style="font-size: 12px; color: #5C6B60">추천 이유: 지난주 동물 이야기에서 대화가 가장 길었어요</span>
</div>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; color: #1A56C4; font-size: 12px; font-weight: 700">미리 볼 단어</span>
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; font-size: 12px">rescue</span>
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; font-size: 12px">porcine</span>
<span style="padding: 5px 10px; border-radius: 999px; background: #FFF; font-size: 12px">toast</span>
</div>
<button onClick="{{ goBookTalk }}" style="border: 0; min-height: 52px; border-radius: 999px; background: #0E6B2C; color: #FFF; font-size: 16px; font-weight: 800">다 읽었으면 북토킹 시작</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<b style="font-size: 15px; padding-bottom: 6px">2주 도서 목록</b>
<sc-for list="{{ plan }}" as="p" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #EEF1EE">
<span style="{{ p.badge }}">{{ p.day }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif">{{ p.title }}</b><span style="font-size: 12px; color: #5C6B60">{{ p.genre }}</span></span>
<span style="{{ p.stateStyle }}">{{ p.state }}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #5C6B60; text-align: center">난이도가 맞지 않나요? 다음 추천에 반영해요</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="border: 1px solid #E3E8E4; background: #FFF; min-height: 48px; border-radius: 999px; font-size: 14px; font-weight: 700; color: #16201A">너무 쉬워요</button>
<button style="border: 1px solid #E3E8E4; background: #FFF; min-height: 48px; border-radius: 999px; font-size: 14px; font-weight: 700; color: #16201A">너무 어려워요</button>
</div>
</div>
</div>
</sc-if>

<!-- ===== ME: 내 정보 ===== -->
<sc-if value="{{ isMe }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 18px">
<div class="topbar" style="padding-top: 16px; display: flex; align-items: center; gap: 8px">
<button aria-label="뒤로" onClick="{{ goHome }}" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #F4F6F4; color: #16201A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
<b style="font-size: 17px">내 정보</b>
</div>
<div style="display: flex; align-items: center; gap: 14px; background: #F4F6F4; border-radius: 20px; padding: 16px">
<span style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #0E6B2C; color: #FFFFFF; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{ childInit }}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 18px">{{ childName }}</b><span style="font-size: 13px; color: #5C6B60">{{ childMeta }}</span></span>
</div>
<sc-if value="{{ meLocked }}" hint-placeholder-val="{{ false }}">
<div style="background: #F4F8FF; color: #1A56C4; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.6">이름·학년은 {{ hostAppName }} 계정 정보를 써요. 바꾸려면 {{ hostAppName }} 설정에서 바꿔 주세요.</div>
</sc-if>
<sc-if value="{{ meEditable }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="meName" style="font-size: 14px; font-weight: 700">이름</label>
<input id="meName" type="text" maxlength="12" value="{{ meNameVal }}" onInput="{{ typeName }}" autocomplete="off" style="min-height: 48px; border: 1px solid #E3E8E4; border-radius: 14px; padding: 0 14px; font-size: 16px; font-family: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">학년</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ meGrades }}" as="g" hint-placeholder-count="6"><button onClick="{{ g.pick }}" style="{{ g.style }}">{{ g.name }}</button></sc-for>
</div>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">

<button onClick="{{ g.say }}" style="border: 0; background: rgba(255,255,255,0.12); color: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg><span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF">{{ g.en }}</b><span style="font-size: 12px; color: #D3E9D9">{{ g.ko }}</span></span></button>
</sc-for>
<span style="font-size: 12px; color: #D3E9D9">한국어로 말해도 괜찮아. 영어로 바꿔 줄게!</span>
</div>
</sc-if>
</sc-for>
<sc-if value="{{ thinking }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; background: #F4F6F4; color: #5C6B60; border-radius: 18px 18px 18px 4px; padding: 12px 16px; font-size: 14px">{{ tutorName }}가 생각 중…</div>
</sc-if>
<sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: #FFF0E3; color: #8A3E06; border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 700">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>{{ hintText }}
</div>
</sc-if>
<sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><div role="alert" style="background: #FFF0E3; color: #8A3E06; border-radius: 14px; padding: 10px 12px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif">{{ err }}</div></sc-if>
</div>
<div style="padding: 10px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 1px solid #E3E8E4">
<div style="display: flex; align-items: center; gap: 28px">
<button aria-label="힌트 보기" onClick="{{ toggleHint }}" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: #FFF0E3; color: #B4530B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></button>
<button aria-label="누르고 말하기" onClick="{{ speak }}" style="{{ micStyle }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
<button aria-label="도란이 말 다시 듣기" onClick="{{ replay }}" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: #E8F0FE; color: #1A56C4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg></button>
</div>
<span style="font-size: 13px; color: #5C6B60">{{ speakLabel }}</span>
<form onSubmit="{{ sendTyped }}" style="width: 100%; display: flex; gap: 8px">
<label for="typed" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">영어로 입력하기</label>
<input id="typed" type="text" autocomplete="off" placeholder="말 대신 써도 돼요 (한국어도 OK)" style="flex: 1; min-width: 0; min-height: 44px; border: 1px solid #E3E8E4; border-radius: 999px; padding: 0 16px; font-size: 15px; font-family: inherit">
<button type="submit" style="flex: none; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #0E6B2C; color: #FFF; font-size: 14px; font-weight: 800">보내기</button>
</form>
</div>
<sc-if value="{{ fbOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeFb }}" style="position: absolute; inset: 0; background: rgba(10,20,14,0.45); z-index: 5"></div>
<div role="dialog" aria-label="심층 피드백" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 14px; font-family: 'Noto Sans KR', sans-serif">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #DDE5DF"></div>
<div style="align-self: flex-end; max-width: 90%; padding: 12px 14px; border-radius: 18px 18px 4px 18px; background: #0E6B2C; color: #FFFFFF; font-size: 16px; font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif">{{ fb.text }}</div>
<sc-if value="{{ fb.hasFix }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: #0B5E25"><span style="width: 20px; height: 20px; border-radius: 50%; background: #0E6B2C; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">✓</span>{{ fb.label }}</span>
<button onClick="{{ fb.say }}" style="border: 1px solid #E3E8E4; background: #F4F6F4; color: #16201A; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; text-align: left; font-size: 16px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif"><span style="flex: 1">{{ fb.fix }}</span><span style="color: #1A56C4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg></span></button>
</div>
</sc-if>
<sc-if value="{{ fb.noFix }}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 700; color: #0B5E25">잘 말했어요! 고칠 곳이 없어요.</span></sc-if>
<sc-if value="{{ fb.why }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: #B4530B"><span style="width: 20px; height: 20px; border-radius: 50%; background: #E8650A; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">!</span>설명</span>
<span style="font-size: 14px; line-height: 1.7; color: #2E3A31">{{ fb.why }}</span>
</div>
</sc-if>
<button onClick="{{ fb.retry }}" style="border: 0; min-height: 52px; border-radius: 999px; background: #0E6B2C; color: #FFFFFF; font-size: 16px; font-weight: 800">따라 말해 보기</button>
</div>
</sc-if>
</div>
</sc-if>

<!-- ===== REVIEW ===== -->
<sc-if value="{{ isReview }}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; padding: 16px 20px 28px; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="닫기" onClick="{{ goHome }}" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #F4F6F4; color: #16201A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
<b style="font-size: 17px">다시 말하기 · {{ reviewNo }}/{{ reviewTotal }}</b>
</div>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; text-align: center">
<span style="font-size: 14px; color: #5C6B60">지난번에 이렇게 말했어요</span>
<s style="font-size: 18px; color: #8A968D; font-family: 'Plus Jakarta Sans', sans-serif">{{ reviewFrom }}</s>
<span style="font-size: 14px; color: #5C6B60">이번엔 이렇게 말해 볼까요?</span>
<b style="font-size: 24px; line-height: 1.4; color: #0E6B2C; font-family: 'Plus Jakarta Sans', sans-serif">{{ reviewTo }}</b>
<button onClick="{{ sayReview }}" style="align-self: center; border: 1px solid #CFDDF8; background: #FFF; color: #1A56C4; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 700">먼저 들어 보기</button>
</div>
<button onClick="{{ nextReview }}" style="border: 0; min-height: 56px; border-radius: 999px; background: #0E6B2C; color: #FFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>{{ reviewBtn }}</button>
</div>
</sc-if>

<!-- ===== DONE ===== -->
<sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px 24px; text-align: center; background: #0E6B2C; color: #FFFFFF">

<path d="M100 48 C74 28 36 28 16 40 L16 156 C38 144 76 144 100 164 Z" fill="#FFFFFF"/>
<path d="M100 48 C126 28 164 28 184 40 L184 156 C162 144 124 144 100 164 Z" fill="#E7F3EA"/>
<path d="M100 48 L100 164" stroke="#E8650A" stroke-width="4"/>
<path d="M50 92 Q62 80 74 92" stroke="#0A3A18" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M126 92 Q138 80 150 92" stroke="#0A3A18" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="44" cy="116" r="8" fill="#F9B98A"/><circle cx="156" cy="116" r="8" fill="#F9B98A"/>
<path d="M82 118 Q100 138 118 118" stroke="#0A3A18" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>

<div style="background: #FFFFFF; color: #16201A; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 24px; color: #0E6B2C">{{ st.sentences }}</b><span style="font-size: 12px; color: #5C6B60">말한 문장</span></div>
<div style="background: #FFFFFF; color: #16201A; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 24px; color: #1A56C4">{{ st.unique }}</b><span style="font-size: 12px; color: #5C6B60">쓴 단어 종류</span></div>
<div style="background: #FFFFFF; color: #16201A; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 24px; color: #B4530B">{{ st.minutes }}분</b><span style="font-size: 12px; color: #5C6B60">대화 시간</span></div>
</div>
<span style="font-size: 14px; color: #D3E9D9">{{ doneNote }}</span>
<button onClick="{{ goReport }}" style="width: 100%; border: 0; min-height: 56px; border-radius: 999px; background: #FFFFFF; color: #0E6B2C; font-size: 17px; font-weight: 800">리포트 보기</button>
<button onClick="{{ goHome }}" style="border: 0; background: none; color: #FFFFFF; font-size: 15px; font-weight: 700; min-height: 44px">홈으로</button>
</div>
</sc-if>

<!-- ===== REPORT ===== -->
<sc-if value="{{ isReport }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div class="topbar" style="padding-top: 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5C6B60">오늘의 이야기 · {{ rp.date }}</span>
<b style="font-size: 24px; letter-spacing: -0.5px">{{ rp.title }}</b>
</div>
<div style="display: flex; background: #F4F6F4; border-radius: 999px; padding: 4px">
<button onClick="{{ setRSum }}" style="{{ rSumBtn }}">요약</button>
<button onClick="{{ setRWord }}" style="{{ rWordBtn }}">단어 분석</button>
<button onClick="{{ setRFix }}" style="{{ rFixBtn }}">교정</button>
</div>

<div style="display: flex; align-items: center; gap: 12px; background: #F4F8FF; border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #1A56C4">
<div style="width: 20px; height: 20px; flex: none; border-radius: 50%; border: 3px solid #CFDDF8; border-top-color: #1F6FEB; animation: spin 0.9s linear infinite"></div>도란이가 리포트를 쓰고 있어요
</div>
</sc-if>

<sc-if value="{{ rSum }}" hint-placeholder-val="{{ true }}">

<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 15px">내가 말한 비율</b><b style="font-size: 26px">{{ rp.ratio }}%</b></div>

</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">말한 문장</span><b style="font-size: 26px; color: #0E6B2C">{{ rp.sentences }}</b><span style="font-size: 11px; color: #5C6B60">{{ rp.turns }}번 대답했어요</span></div>
<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">평균 문장 길이</span><b style="font-size: 26px; color: #0E6B2C">{{ rp.avg }}단어</b><span style="font-size: 11px; color: #5C6B60">길수록 자세히 말한 거예요</span></div>

<div style="background: #F4F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5C6B60">고친 표현</span><b style="font-size: 26px; color: #0E6B2C">{{ rp.fixCount }}개</b><span style="font-size: 11px; color: #5C6B60">교정 탭에서 확인</span></div>

<sc-for list="{{ rp.goals }}" as="g" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px"><span style="{{ g.badge }}">{{ g.mark }}</span><span style="flex: 1; font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif">{{ g.en }}</span><span style="font-size: 12px; color: #5C6B60">{{ g.state }}</span></div>
</sc-for>
<span style="font-size: 12px; color: #5C6B60">{{ rp.sourceNote }}</span>
</div>
</sc-if>
<div style="background: #E7F3EA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<b style="font-size: 15px; color: #0B5E25">잘했어요</b>

</div>
<div style="border: 1px solid #E3E8E4; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<b style="font-size: 15px">내용 이해</b>
<span style="font-size: 14px; line-height: 1.6; color: #2E3A31">{{ rp.comprehension }}</span>
</div>
</div>
</sc-if>

<sc-if value="{{ rWord }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #F4F6F4; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5C6B60">말한 단어</span><b style="font-size: 22px; color: #0E6B2C">{{ rp.total }}</b></div>

<div style="background: #F4F6F4; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5C6B60">어휘 다양도</span><b style="font-size: 22px; color: #B4530B">{{ rp.ttr }}%</b></div>
</div>
<div style="border: 1px solid #E3E8E4; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 15px">많이 쓴 단어</b><span style="font-size: 11px; color: #767676">a, the 같은 기본 단어 제외</span></div>
<sc-for list="{{ rp.topWords }}" as="t" hint-placeholder-count="6">

<span style="width: 84px; font-size: 14px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; text-overflow: ellipsis">{{ t.w }}</span>

</div>
</sc-for>
</div>
<div style="border: 1px solid #E3E8E4; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<b style="font-size: 15px">책에서 배운 단어, 써 봤을까?</b>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ rp.bookWords }}" as="b" hint-placeholder-count="5">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700">{{ b.w }}</span>
<span style="{{ b.style }}">{{ b.label }}</span>
</div>
</sc-for>
</div>
</div>
<sc-if value="{{ rp.overWord }}" hint-placeholder-val="{{ false }}">

      books: agg.books, minutes: agg.minutes, newWords: agg.newWords, vocab: agg.vocab,
      srcList: srcList, goalRate: goalRate,
      weekBtn: seg(s.period === 'week'), monthBtn: seg(s.period === 'month'), yearBtn: seg(s.period === 'year'),
      setWeek: set({ period: 'week' }), setMonth: set({ period: 'month' }), setYear: set({ period: 'year' }),

      vBoard: s.sub === 'board', vMile: s.sub === 'mile', vHall: s.sub === 'hall',
      subBoard: under(s.sub === 'board'), subMile: under(s.sub === 'mile'), subHall: under(s.sub === 'hall'),
      setBoard: set({ sub: 'board' }), setMile: set({ sub: 'mile' }), setHall: set({ sub: 'hall' }),
      kRead: seg(s.kind === 'read'), kDays: seg(s.kind === 'days'), setRead: set({ kind: 'read' }), setDays: set({ kind: 'days' }),
      toggleSame: function () { self.setState({ same: !s.same }); },
      sameTrack: 'width:40px;height:24px;border-radius:12px;padding:3px;display:flex;background:' + (s.same ? G : '#C9D1CB') + ';justify-content:' + (s.same ? 'flex-end' : 'flex-start'),
      sameKnob: 'width:18px;height:18px;border-radius:50%;background:#FFF;display:block',
      boardDesc: s.kind === 'read' ? '11월 완독한 책 수' : '11월 북토킹한 날 수',
      myRank: s.kind === 'read' ? '7' : '9', myScore: s.kind === 'read' ? '5권' : '5일',
      board: board, miles: miles, hall: hall, totalBooks: totalBooks
    };
  }
}
mount(Component);
</script>
